[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'

[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
ranlib = 'emranlib'
strip = 'emstrip'
pkgconfig = 'pkg-config'
exe_wrapper = 'node'

[built-in options]
c_std = 'c11'
cpp_std = 'c++17'
default_library = 'static'
buildtype = 'release'
optimization = '3'
debug = false
b_lto = true
b_lto_mode = 'default'
b_ndebug = 'if-release'

[properties]
needs_exe_wrapper = true
sys_root = ''

c_args = [
    '-msimd128',
    '-pthread',
    '-DWASM_SIMD=1',
    '-DWASM_THREADING=1',
    '-DHB_WASM_NATIVE_FS=1',
    '-ffast-math',
    '-DNDEBUG'
]

c_link_args = [
    '-msimd128',
    '-pthread',
    '-s', 'USE_PTHREADS=1',
    '-s', 'PTHREAD_POOL_SIZE=4',
    '-s', 'WASM=1',
    '-s', 'MODULARIZE=1',
    '-s', 'EXPORT_ES6=1',
    '-s', 'INITIAL_MEMORY=33554432',
    '-s', 'MAXIMUM_MEMORY=268435456',
    '-s', 'ALLOW_MEMORY_GROWTH=1',
    '-s', 'STACK_SIZE=5242880',
    '-s', 'ASSERTIONS=0',
    '-s', 'NODEJS_CATCH_EXIT=0',
    '-s', 'NODEJS_CATCH_REJECTION=0',
    '--closure=1',
    '-flto'
]

cpp_args = [
    '-msimd128',
    '-pthread',
    '-DWASM_SIMD=1',
    '-DWASM_THREADING=1', 
    '-DHB_WASM_NATIVE_FS=1',
    '-ffast-math',
    '-DNDEBUG'
]

cpp_link_args = [
    '-msimd128',
    '-pthread',
    '-s', 'USE_PTHREADS=1',
    '-s', 'PTHREAD_POOL_SIZE=4',
    '-s', 'WASM=1',
    '-s', 'MODULARIZE=1',
    '-s', 'EXPORT_ES6=1',
    '-s', 'INITIAL_MEMORY=33554432',
    '-s', 'MAXIMUM_MEMORY=268435456',
    '-s', 'ALLOW_MEMORY_GROWTH=1',
    '-s', 'STACK_SIZE=5242880',
    '-s', 'ASSERTIONS=0',
    '-s', 'NODEJS_CATCH_EXIT=0',
    '-s', 'NODEJS_CATCH_REJECTION=0',
    '--closure=1',
    '-flto'
]