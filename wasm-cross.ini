[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'

[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
ranlib = 'emranlib'
strip = 'emstrip'
pkgconfig = 'pkg-config'
exe_wrapper = 'node'

[built-in options]
c_std = 'c11'
cpp_std = 'c++17'
default_library = 'static'
buildtype = 'release'
optimization = '3'
debug = false
b_lto = true
b_lto_mode = 'default'
b_ndebug = 'if-release'

[properties]
needs_exe_wrapper = true
sys_root = ''

# Use built-in options instead of properties section